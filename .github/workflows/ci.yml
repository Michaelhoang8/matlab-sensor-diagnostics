name: Native validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave
      - run: octave --no-gui --quiet --eval 'run_tests'
      - run: octave --no-gui --quiet --eval 'run_demo'
